server:
  port: 8081


spring:
  datasource:
    url: ${env.URL_DB}
    username: ${env.username_DB}
    password: ${env.password_DB}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true


