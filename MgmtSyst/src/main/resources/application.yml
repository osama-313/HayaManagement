server:
  port: 8081  # Change this to 443 for HTTPS
  ssl:
    key-store-type: PKCS12
    key-store: classpath:keystore.p12  # Ensure keystore.p12 is placed in src/main/resources
    key-store-password: Hello@112233 # The password you set when creating the keystore
    key-alias: tomcat


spring:
  datasource:
    url: ${URL_DB}
    username: ${username_DB}
    password: ${password_DB}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true


